name: jamony-demo-build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Build version tag (e.g. v0.1.0-alpha)'
        required: true
        default: 'v0.1.0-alpha'

jobs:
  build-macos:
    name: Build MacOS
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          path: jamony-private

      - uses: actions/checkout@v7
        with:
          repository: jamonyapp/jamony-jamsoul
          fetch-depth: 1
          path: jamsoul-source

      # 09-30 欢哥拍板：删除 06-13 的颜色补丁步骤——7 月起大魔改已吸收全部改动，
      # jamony-jamsoul 仓库 main 即唯一权威版本，checkout 直接编译
      - name: Install Qt
        run: |
          cd jamsoul-source
          QT_VERSION=6.10.2 TARGET_ARCHS='x86_64 arm64' ./.github/autobuild/mac.sh setup
        env:
          JAMSOUL_BUILD_VERSION: '1.0.0'
          JAMULUS_BUILD_VERSION: '1.0.0'

      - name: Build jamsoul
        run: |
          cd jamsoul-source
          QT_VERSION=6.10.2 TARGET_ARCHS='x86_64 arm64' ./.github/autobuild/mac.sh build
        env:
          JAMSOUL_BUILD_VERSION: '1.0.0'
          JAMULUS_BUILD_VERSION: '1.0.0'

      - name: Extract jamsoul.app (with Qt frameworks)
        run: |
          # 复制完整的 Jamulus.app（已含 Qt 框架，由 macdeployqt 部署）
          cp -a jamsoul-source/deploy/Jamulus.app jamony-private/electron/jamsoul.app/
          # 内部二进制改名 Jamulus → jamsoul
          mv jamony-private/electron/jamsoul.app/Contents/MacOS/Jamulus jamony-private/electron/jamsoul.app/Contents/MacOS/jamsoul
          # Info.plist 改名为 jamsoul
          plutil -replace CFBundleExecutable -string jamsoul jamony-private/electron/jamsoul.app/Contents/Info.plist
          plutil -replace CFBundleName -string jamsoul jamony-private/electron/jamsoul.app/Contents/Info.plist
          plutil -replace CFBundleDisplayName -string jamsoul jamony-private/electron/jamsoul.app/Contents/Info.plist
          plutil -replace CFBundleIdentifier -string com.jamony.jamsoul jamony-private/electron/jamsoul.app/Contents/Info.plist
          # jamsoul 是 Electron 子进程，不需要 App Sandbox
          # 去掉旧签名（含沙箱）→ 重新 adhoc 签名（不含沙箱）
          codesign --remove-signature jamony-private/electron/jamsoul.app/Contents/MacOS/jamsoul
          codesign -f -s - jamony-private/electron/jamsoul.app/Contents/MacOS/jamsoul
          codesign -d --entitlements - jamony-private/electron/jamsoul.app/Contents/MacOS/jamsoul 2>&1 | grep sandbox || echo "sandbox removed OK"
          ls -lh jamony-private/electron/jamsoul.app/Contents/MacOS/
          echo "---Qt frameworks---"
          ls jamony-private/electron/jamsoul.app/Contents/Frameworks/ 2>/dev/null

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build Electron app
        run: |
          cd jamony-private/electron
          npm install
          npx electron-builder --mac --config

      - uses: actions/upload-artifact@v7
        with:
          name: jamony-${{ github.event.inputs.version }}-macos
          path: |
            jamony-private/electron/dist/*.dmg
            jamony-private/dist/*.dmg
          retention-days: 30
          if-no-files-found: warn

  build-windows:
    name: Build Windows
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          path: jamony-private

      - uses: actions/checkout@v7
        with:
          repository: jamonyapp/jamony-jamsoul
          fetch-depth: 1
          path: jamsoul-source

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtmultimedia'
          archives: 'qtbase qttools qttranslations'

      # 09-30 删除颜色补丁步骤（jamsoul 仓库 main 即权威版，见上方 Mac job 注释）

      - name: Install ASIO SDK
        shell: pwsh
        run: |
          # Windows 标准构建（ASIO 音频后端）必需：Jamulus.pro qmake 时强制检查 libs/ASIOSDK2/common
          # 与 jamsoul 官方 CI 同源（windows/deploy_windows.ps1 Install-Dependency 同款 URL/布局）
          $url = "https://download.steinberg.net/sdk_downloads/ASIO-SDK_2.3.4_2025-10-15.zip"
          $tmp = "$env:TEMP\asio.zip"
          Invoke-WebRequest -Uri $url -OutFile $tmp
          $unpack = "$env:TEMP\asio-unpack"
          Expand-Archive -Path $tmp -DestinationPath $unpack -Force
          # zip 顶层目录即 SDK 根（common/host/...），整体搬为 libs/ASIOSDK2
          New-Item -ItemType Directory -Force -Path jamsoul-source\libs | Out-Null
          Move-Item -Path "$unpack\*" -Destination jamsoul-source\libs\ASIOSDK2
          if (-not (Test-Path "jamsoul-source\libs\ASIOSDK2\common\asio.cpp")) { throw "ASIO SDK 结构不对：libs/ASIOSDK2/common 缺失" }
          echo "ASIO SDK OK"

      - name: Build jamsoul
        shell: cmd
        run: |
          cd jamsoul-source
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          rem 09-30 去掉 CONFIG+=nosound（06-13 的残血无音频配置，Win 版 jamsoul 秒退的根因）
          qmake Jamulus.pro -r -spec win32-msvc
          nmake
          mkdir ..\jamony-private\dist\jamsoul-bin
          copy release\jamulus.exe ..\jamony-private\dist\jamsoul-bin\jamsoul.exe
          where windeployqt
          windeployqt --release ..\jamony-private\dist\jamsoul-bin\jamsoul.exe

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build Electron app
        shell: pwsh
        run: |
          Set-Location jamony-private/electron
          npm install
          Write-Host "=== Running electron-builder ==="
          npx.cmd electron-builder --win --config --publish never 2>&1
          Write-Host "=== Exit code: $LASTEXITCODE ==="


      - name: Debug dist
        if: always()
        shell: bash
        run: |
          echo === jamony-private/dist ===
          find jamony-private/dist -name "*.exe" -ls 2>/dev/null || echo no exe found
          echo === electron dir ===
          ls jamony-private/electron/dist/ 2>/dev/null || echo no dir

      - uses: actions/upload-artifact@v7
        with:
          name: jamony-${{ github.event.inputs.version }}-windows
          path: |
            jamony-private/dist/jamony*Setup*.exe
          retention-days: 30
          if-no-files-found: warn

  # jamony 10-02: 云端 Linux 二进制改在 CI 编（runner 7G 内存），服务器(2G)只安装不再编译。
  # 教训：10-02 服务器 make -j2 编 ghost 触发内存压死整机（OOM 抖动+重启恢复）。
  # 产物：jamsoul-ghost（推流客户端=完整构建，服务器上 -n 运行）
  #       jamsoul-headless（CONFIG+=headless 房间服务器）；ubuntu-24.04 与服务器同版(glibc 兼容)。
  build-linux:
    name: Build Linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          repository: jamonyapp/jamony-jamsoul
          fetch-depth: 1
          path: jamsoul-source

      - name: Install Qt6 + JACK dev
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qmake6 qt6-multimedia-dev qt6-l10n-tools libjack-jackd2-dev

      # jamony 10-02 坑：Linux qmake 产物=构建目录根上的 Jamulus（大写J、无release/子目录）
      - name: Build jamsoul-ghost (client)
        run: |
          cd jamsoul-source
          mkdir -p build-ghost && cd build-ghost
          qmake6 ../Jamulus.pro
          make -j$(nproc)
          BIN=$(find . -maxdepth 1 -type f -iname jamulus -executable | head -1)
          [ -n "$BIN" ] || { echo "jamulus binary not found"; find . -maxdepth 1 -type f; exit 1; }
          cp "$BIN" ../jamsoul-ghost

      - name: Build jamsoul-headless (server)
        run: |
          cd jamsoul-source
          mkdir -p build-headless && cd build-headless
          qmake6 ../Jamulus.pro "CONFIG+=headless"
          make -j$(nproc)
          BIN=$(find . -maxdepth 1 -type f -iname jamulus -executable | head -1)
          [ -n "$BIN" ] || { echo "jamulus binary not found"; find . -maxdepth 1 -type f; exit 1; }
          cp "$BIN" ../jamsoul-headless

      - uses: actions/upload-artifact@v7
        with:
          name: jamony-${{ github.event.inputs.version }}-linux
          path: |
            jamsoul-source/jamsoul-ghost
            jamsoul-source/jamsoul-headless
          retention-days: 30
          if-no-files-found: error
